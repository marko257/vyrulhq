<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vyrul HQ — We clip. You grow.</title>
<meta name="description" content="Managed short-form content for podcasters, founders, and creators. Strategy, editing, and posting across TikTok, Instagram Reels, and YouTube Shorts — fully handled." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ------- Vyrul HQ — Design tokens ------- */
:root {
  --bg: #07070a;
  --bg-2: #0d0d12;
  --bg-3: #14141c;
  --line: #1f1f2a;
  --line-2: #2a2a38;
  --fg: #f4f3ef;
  --fg-2: #b6b6c2;
  --fg-3: #6e6e7e;

  --accent: #d4ff3a;
  --accent-ink: #0a0a0a;
  --accent-glow: rgba(212, 255, 58, 0.35);

  --magenta: #ff4dd2;
  --cyan: #58e1ff;

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  --container: 1240px;
  --pad-x: clamp(20px, 4vw, 56px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
body {
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
::selection { background: var(--accent); color: var(--accent-ink); }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: -0.01em; }
.eyebrow {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-3);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before {
  content: "";
  width: 18px; height: 1px;
  background: var(--accent);
}

.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 var(--pad-x);
}

/* ---- Typography ---- */
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.025em; line-height: 1.02; }
h1 { font-size: clamp(48px, 7vw, 104px); font-weight: 600; letter-spacing: -0.04em; }
h2 { font-size: clamp(36px, 4.6vw, 64px); letter-spacing: -0.035em; }
h3 { font-size: clamp(22px, 2vw, 28px); }
p { margin: 0; }

.glow-text { color: var(--accent); }
.strike-through-accent { position: relative; display: inline-block; }
.strike-through-accent::after {
  content: ""; position: absolute; left: -4%; right: -4%; bottom: 0.18em;
  height: 0.45em; background: var(--accent); opacity: 0.95; z-index: -1; border-radius: 2px;
}

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px;
  border-radius: var(--radius-pill);
  font-weight: 600; font-size: 15px;
  transition: transform 120ms ease, background 120ms ease, color 120ms ease, box-shadow 200ms ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 0 0 0 var(--accent-glow), 0 10px 30px -10px var(--accent-glow);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 0 6px var(--accent-glow), 0 14px 40px -8px var(--accent-glow);
}
.btn-primary .arrow { transition: transform 200ms ease; }
.btn-primary:hover .arrow { transform: translateX(3px); }
.btn-ghost {
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--line-2);
}
.btn-ghost:hover { border-color: var(--fg-2); }
.btn-lg { padding: 18px 28px; font-size: 16px; }

/* ---- Nav ---- */
.nav-wrap {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 100;
  transition: background 220ms ease, backdrop-filter 220ms ease, border-color 220ms ease, padding 220ms ease;
  padding: 18px 0;
  border-bottom: 1px solid transparent;
}
.nav-wrap.scrolled {
  background: rgba(7,7,10,0.72);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom-color: var(--line);
  padding: 12px 0;
}
.nav {
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
}
.nav-links {
  display: flex; gap: 28px; align-items: center;
}
.nav-links a {
  font-size: 14.5px;
  color: var(--fg-2);
  position: relative;
  padding: 6px 0;
}
.nav-links a:hover { color: var(--fg); }
.nav-links a::after {
  content: ""; position: absolute; left: 0; right: 100%; bottom: 0;
  height: 1px; background: var(--accent);
  transition: right 240ms ease;
}
.nav-links a:hover::after { right: 0; }

.logo {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 700; letter-spacing: -0.02em; font-size: 19px;
}
.logo-mark { width: 28px; height: 28px; display: block; }

/* ---- Mobile nav ---- */
.nav-menu-btn {
  display: none;
  flex-direction: column; justify-content: center; align-items: center;
  width: 40px; height: 40px; gap: 5px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  cursor: pointer;
  flex-shrink: 0;
}
.nav-menu-btn span {
  display: block; width: 18px; height: 1.5px;
  background: var(--fg);
  transition: transform 200ms ease, opacity 200ms ease;
}
.nav-menu-btn.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-menu-btn.open span:nth-child(2) { opacity: 0; }
.nav-menu-btn.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.mobile-menu {
  display: none;
  position: fixed; inset: 0; top: 64px;
  background: rgba(7,7,10,0.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 99;
  flex-direction: column;
  padding: 32px var(--pad-x) 48px;
  border-top: 1px solid var(--line);
  overflow-y: auto;
}
.mobile-menu.open { display: flex; }
.mobile-menu nav {
  display: flex; flex-direction: column; gap: 4px;
  margin-bottom: 32px;
}
.mobile-menu nav a {
  font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  color: var(--fg-2);
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  display: block;
  transition: color 160ms ease;
}
.mobile-menu nav a:last-child { border-bottom: none; }
.mobile-menu nav a:hover { color: var(--fg); }
.mobile-menu .btn { width: 100%; justify-content: center; }

@media (max-width: 800px) {
  .nav-links { display: none; }
  .nav-wrap .btn-primary { display: none; }
  .nav-wrap .btn-ghost { display: none; }
  .nav-menu-btn { display: flex; }
}

/* ---- Hero ---- */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex; align-items: center;
  padding-top: 120px; padding-bottom: 80px;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.hero-bg {
  position: absolute; inset: 0; z-index: 0;
}
.hero-bg canvas { width: 100%; height: 100%; display: block; }
.hero-bg::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 100%, transparent 30%, var(--bg) 85%),
              linear-gradient(180deg, rgba(7,7,10,0.4) 0%, transparent 30%, transparent 70%, var(--bg) 100%);
  pointer-events: none;
}
.hero-content {
  position: relative; z-index: 1;
  width: 100%;
}
.hero-eyebrow-row {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-bottom: 28px;
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(212, 255, 58, 0.18);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(212, 255, 58, 0.18); }
  50% { box-shadow: 0 0 0 8px rgba(212, 255, 58, 0.05); }
}
.hero h1 { max-width: 16ch; }
.hero h1 .accent-word {
  color: var(--accent);
  font-style: italic;
  font-weight: 500;
}
.hero-sub {
  margin-top: 22px;
  font-size: clamp(17px, 1.4vw, 20px);
  color: var(--fg-2);
  max-width: 52ch;
}
.hero-ctas {
  margin-top: 38px;
  display: flex; gap: 14px; flex-wrap: wrap;
  align-items: center;
}
.hero-meta {
  margin-top: 32px;
  display: flex; gap: 18px; flex-wrap: wrap;
  color: var(--fg-3);
  font-size: 13px;
}
.hero-meta-item { display: inline-flex; align-items: center; gap: 8px; }
.check-mark {
  width: 14px; height: 14px;
  display: inline-block; flex-shrink: 0;
  color: var(--accent);
}

/* ---- Credibility bar ---- */
.cred-bar {
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}
.cred-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
}
.cred-stat {
  padding: 36px 28px;
  border-right: 1px solid var(--line);
  position: relative;
}
.cred-stat:last-child { border-right: none; }
.cred-num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(32px, 3.4vw, 48px);
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1;
}
.cred-num .unit { color: var(--accent); margin-left: 2px; }
.cred-label {
  margin-top: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
}
@media (max-width: 800px) {
  .cred-grid { grid-template-columns: repeat(2, 1fr); }
  .cred-stat { border-bottom: 1px solid var(--line); }
  .cred-stat:nth-child(2) { border-right: none; }
}

/* ---- Section base ---- */
section { position: relative; }
.section-pad { padding: 120px 0; }
.section-head { margin-bottom: 64px; max-width: 720px; }
.section-head .eyebrow { margin-bottom: 22px; }
.section-head h2 { margin-bottom: 18px; }
.section-head p { color: var(--fg-2); font-size: 18px; max-width: 56ch; }

/* ---- What We Do ---- */
.wwd-grid {
  display: grid; grid-template-columns: 1fr 1.1fr;
  gap: 80px; align-items: center;
}
.wwd-bullets {
  list-style: none; padding: 0; margin: 28px 0 0;
  display: flex; flex-direction: column; gap: 14px;
}
.wwd-bullets li {
  display: flex; gap: 14px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
  font-size: 16px;
  color: var(--fg-2);
}
.wwd-bullets li:last-child { border-bottom: 1px solid var(--line); }
.wwd-bullets li b { color: var(--fg); font-weight: 600; }
.wwd-bullets .bnum {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--accent);
  padding-top: 4px;
  width: 24px; flex-shrink: 0;
}

/* Transformation visual */
.transform-viz {
  position: relative;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 28px;
  aspect-ratio: 4/3;
  overflow: hidden;
}
.tv-grid {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 18px; align-items: center; height: 100%;
}
.tv-card {
  border-radius: var(--radius);
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  padding: 14px;
  height: 100%;
  position: relative;
  display: flex; flex-direction: column;
}
.tv-card-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 12px;
}
.tv-source {
  flex: 1;
  border-radius: 10px;
  background: repeating-linear-gradient(135deg, #1a1a24 0 8px, #15151e 8px 16px);
  position: relative;
  overflow: hidden;
}
.tv-source::before {
  content: "16:9 LONG-FORM";
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--fg-3); letter-spacing: 0.16em;
}
.tv-timeline {
  height: 26px;
  margin-top: 10px;
  border-radius: 4px;
  background: var(--bg);
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
}
.tv-timeline::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 38%;
  background: linear-gradient(90deg, var(--accent) 0%, rgba(212,255,58,0.3) 100%);
}
.tv-timeline::after {
  content: ""; position: absolute; left: 38%; top: 0; bottom: 0; width: 2px;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}
.tv-arrow {
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  flex-direction: column; gap: 6px;
}
.tv-clips {
  display: grid; grid-template-rows: repeat(3, 1fr);
  gap: 8px; height: 100%;
}
.tv-clip {
  border-radius: 8px;
  background: linear-gradient(135deg, #1d1d28, #15151e);
  border: 1px solid var(--line-2);
  position: relative;
  overflow: hidden;
  padding: 8px 10px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.tv-clip-bar { height: 4px; background: var(--accent); border-radius: 2px; opacity: 0.6; }
.tv-clip:nth-child(2) .tv-clip-bar { width: 70%; opacity: 0.8; }
.tv-clip:nth-child(3) .tv-clip-bar { width: 45%; opacity: 0.95; }
.tv-clip:nth-child(1) .tv-clip-bar { width: 90%; }
.tv-clip-foot {
  display: flex; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--fg-3);
}
.tv-clip-views { color: var(--accent); }

@media (max-width: 900px) {
  .wwd-grid { grid-template-columns: 1fr; gap: 40px; }
  .transform-viz { aspect-ratio: 16/10; }
}

/* ---- Who It's For ---- */
.who-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
}
.who-card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 28px;
  position: relative;
  overflow: hidden;
  transition: border-color 200ms ease, transform 200ms ease;
  display: flex; flex-direction: column; min-height: 280px;
}
.who-card::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 100% 0%, rgba(212,255,58,0.08), transparent 50%);
  opacity: 0; transition: opacity 280ms ease;
}
.who-card:hover { border-color: var(--line-2); transform: translateY(-2px); }
.who-card:hover::before { opacity: 1; }
.who-icon {
  width: 44px; height: 44px;
  border-radius: 10px;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 24px;
  color: var(--accent);
}
.who-card h3 { margin-bottom: 16px; }
.who-card .pain {
  color: var(--fg-3); font-size: 14px;
  padding-bottom: 12px; margin-bottom: 12px;
  border-bottom: 1px dashed var(--line-2);
}
.who-card .pain-label, .who-card .sol-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-3);
  margin-bottom: 6px; display: block;
}
.who-card .sol-label { color: var(--accent); }
.who-card .sol { color: var(--fg-2); font-size: 14px; }
.who-body { color: var(--fg-2); font-size: 14.5px; line-height: 1.6; }
.who-card .num {
  position: absolute; top: 20px; right: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--fg-3);
}

@media (max-width: 1000px) {
  .who-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 540px) {
  .who-grid { grid-template-columns: 1fr; }
}

/* ---- How It Works ---- */
.how-wrap { position: relative; }
.steps {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  position: relative;
}
.steps::before {
  content: ""; position: absolute;
  left: 8%; right: 8%; top: 50px;
  height: 1px;
  background: repeating-linear-gradient(90deg, var(--line-2) 0 6px, transparent 6px 12px);
  z-index: 0;
}
.step {
  position: relative; z-index: 1;
  background: var(--bg);
  padding: 12px 0;
}
.step-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: 0.14em;
  margin-bottom: 14px;
}
.step-badge {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--line-2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  color: var(--accent);
  margin-bottom: 22px;
  position: relative;
}
.step-badge::after {
  content: ""; position: absolute; inset: -6px;
  border-radius: 50%;
  border: 1px solid transparent;
  background: conic-gradient(from 0deg, var(--accent), transparent 25%, transparent 100%) border-box;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0.5;
}
.step h3 { margin-bottom: 12px; }
.step p { color: var(--fg-2); font-size: 15px; }
.step-tag {
  margin-top: 16px;
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--accent);
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: rgba(212,255,58,0.08);
  border: 1px solid rgba(212,255,58,0.2);
}

@media (max-width: 900px) {
  .steps { grid-template-columns: 1fr; }
  .steps::before { display: none; }
}

/* ---- Portal Preview ---- */
.portal-section { overflow: hidden; }
.portal-section .section-inner { max-width: 1100px; margin: 0 auto; padding: 0 var(--pad-x); }
.portal-lead { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; flex-wrap: wrap; margin-bottom: 48px; }
.portal-lead p { color: var(--fg-2); font-size: 16px; max-width: 44ch; }
.portal-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
.portal-tab {
  padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line-2);
  background: transparent; color: var(--fg-2); font-size: 13.5px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: all 150ms;
}
.portal-tab:hover { color: var(--fg-1); border-color: var(--fg-3); }
.portal-tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.portal-browser {
  border-radius: 12px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  background: #f5f5f7;
}
.portal-chrome {
  background: #e8e8ed; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.portal-dots { display: flex; gap: 6px; }
.portal-dot { width: 12px; height: 12px; border-radius: 50%; }
.portal-dot.red { background: #ff5f57; }
.portal-dot.yellow { background: #febc2e; }
.portal-dot.green { background: #28c840; }
.portal-urlbar {
  flex: 1; background: #fff; border-radius: 6px;
  padding: 4px 12px; font-size: 12px; color: #666;
  display: flex; align-items: center; gap: 6px;
  max-width: 320px; margin: 0 auto;
}
.portal-urlbar svg { width: 12px; height: 12px; flex-shrink: 0; }
.portal-body {
  background: #fff; height: 540px; overflow: hidden;
  display: flex;
}
/* portal sidebar */
.p-sidebar {
  width: 200px; flex-shrink: 0; border-right: 1px solid #e8e8ed;
  padding: 20px 0; display: flex; flex-direction: column; gap: 2px;
}
.p-sidebar-logo {
  padding: 0 16px 16px; font-weight: 700; font-size: 14px; color: #111;
  border-bottom: 1px solid #e8e8ed; margin-bottom: 8px;
}
.p-sidebar-logo span { color: #16a34a; }
.p-nav-item {
  padding: 8px 16px; font-size: 13px; color: #555; cursor: pointer;
  display: flex; align-items: center; gap: 8px; border-radius: 0;
  transition: background 100ms;
}
.p-nav-item:hover { background: #f5f5f7; }
.p-nav-item.active { background: #f0fdf4; color: #16a34a; font-weight: 500; }
.p-nav-icon { width: 16px; height: 16px; opacity: 0.7; }
.p-nav-item.active .p-nav-icon { opacity: 1; }
/* portal main */
.p-main { flex: 1; padding: 28px 32px; overflow: hidden; background: #fff; }
.p-eyebrow { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #999; margin-bottom: 6px; }
.p-title { font-size: 28px; font-weight: 700; color: #111; letter-spacing: -0.02em; margin-bottom: 4px; }
.p-title .hi { color: #16a34a; }
.p-subtitle { font-size: 13px; color: #555; margin-bottom: 22px; }
.p-subtitle b { color: #111; }
.p-stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 22px; }
.p-stat { border: 1px solid #e8e8ed; border-radius: 8px; padding: 14px; }
.p-stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: #999; margin-bottom: 6px; }
.p-stat-val { font-size: 20px; font-weight: 700; color: #111; }
.p-stat-sub { font-size: 10px; color: #999; margin-top: 2px; }
.p-section-label { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: #999; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #e8e8ed; }
.p-jump-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.p-jump-card { border: 1px solid #e8e8ed; border-radius: 8px; padding: 12px; cursor: pointer; transition: border-color 150ms; }
.p-jump-card:hover { border-color: #16a34a; }
.p-jump-card.active { border-color: #16a34a; background: #f0fdf4; }
.p-jump-icon { width: 28px; height: 28px; border-radius: 6px; background: #f0fdf4; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 14px; }
.p-jump-card.active .p-jump-icon { background: #16a34a; }
.p-jump-name { font-size: 12px; font-weight: 600; color: #111; }
.p-jump-desc { font-size: 10px; color: #999; margin-top: 2px; }
/* calendar screen */
.p-cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.p-cal-nav-btn { width: 26px; height: 26px; border: 1px solid #e8e8ed; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #555; cursor: pointer; background: #fff; font-family: inherit; }
.p-cal-month { font-size: 16px; font-weight: 700; color: #111; }
.p-cal-today { margin-left: 4px; padding: 4px 10px; border: 1px solid #e8e8ed; border-radius: 6px; font-size: 11px; color: #555; background: #fff; cursor: pointer; font-family: inherit; }
.p-cal-views { display: flex; gap: 4px; margin-left: auto; }
.p-cal-view { padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; border: none; background: transparent; color: #555; font-family: inherit; }
.p-cal-view.active { background: #16a34a; color: #fff; }
.p-cal-grid { display: grid; grid-template-columns: repeat(7,1fr); border: 1px solid #e8e8ed; border-radius: 8px; overflow: hidden; }
.p-cal-dow { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: #999; padding: 6px 8px; background: #fafafa; border-bottom: 1px solid #e8e8ed; text-align: center; }
.p-cal-cell { border-right: 1px solid #e8e8ed; border-bottom: 1px solid #e8e8ed; padding: 5px 6px; min-height: 72px; vertical-align: top; }
.p-cal-cell:nth-child(7n) { border-right: none; }
.p-cal-day { font-size: 11px; font-weight: 600; color: #111; margin-bottom: 3px; }
.p-clip-chip { display: flex; align-items: center; gap: 4px; background: #f5f5f7; border-radius: 4px; padding: 2px 5px; margin-bottom: 2px; cursor: pointer; }
.p-clip-chip:hover { background: #e8e8ed; }
.p-clip-thumb { width: 18px; height: 18px; border-radius: 2px; background: #ddd; flex-shrink: 0; object-fit: cover; }
.p-clip-title { font-size: 9px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
.p-clip-views { font-size: 8px; color: #999; white-space: nowrap; }
/* strategy screen */
.p-strategy-card { border: 1px solid #e8e8ed; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.p-strategy-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.p-strategy-icon { width: 26px; height: 26px; border-radius: 6px; background: #f0fdf4; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.p-strategy-title { font-size: 13px; font-weight: 600; color: #111; }
.p-strategy-items { display: flex; flex-direction: column; gap: 6px; }
.p-strategy-item { font-size: 11.5px; color: #444; display: flex; gap: 6px; }
.p-strategy-item::before { content: '•'; color: #16a34a; flex-shrink: 0; }

/* this month two-col */
.p-this-month-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.p-card { border: 1px solid #e8e8ed; border-radius: 8px; padding: 14px 16px; }
.p-card-label { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: #999; margin-bottom: 10px; }
.p-top-clip-inner { display: flex; gap: 10px; }
.p-top-clip-thumb {
  width: 56px; height: 72px; border-radius: 5px; flex-shrink: 0;
  background: linear-gradient(160deg,#c9a0a0,#9a7ab0);
  position: relative; overflow: hidden;
}
.p-top-clip-thumb::after {
  content: '▶'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: rgba(255,255,255,0.8);
}
.p-top-clip-views { font-size: 20px; font-weight: 800; color: #111; line-height: 1; margin-bottom: 4px; letter-spacing: -0.02em; }
.p-top-clip-views-label { font-size: 8px; text-transform: uppercase; letter-spacing: .1em; color: #999; margin-bottom: 6px; }
.p-top-clip-desc { font-size: 10px; color: #444; line-height: 1.4; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.p-top-clip-meta { font-size: 9px; color: #999; margin-bottom: 5px; }
.p-top-clip-watch { font-size: 10px; font-weight: 600; color: #16a34a; display: inline-flex; align-items: center; gap: 3px; }
/* platform performance */
.p-perf-label { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: #999; margin-bottom: 2px; text-align: right; }
.p-perf-total { font-size: 9px; color: #999; text-align: right; margin-bottom: 10px; }
.p-platform-row { margin-bottom: 10px; }
.p-platform-row:last-child { margin-bottom: 0; }
.p-platform-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.p-platform-name { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #111; }
.p-platform-icon { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }
.p-platform-icon.yt { background: #ff0000; color: #fff; }
.p-platform-icon.tt { background: #000; color: #fff; font-size: 8px; }
.p-platform-icon.ig { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; }
.p-platform-stat { font-size: 13px; font-weight: 700; color: #111; }
.p-platform-pct { font-size: 9px; color: #999; text-align: right; }
.p-bar-track { height: 4px; background: #f0f0f0; border-radius: 2px; overflow: hidden; }
.p-bar-fill { height: 100%; border-radius: 2px; }
.p-platform-na { font-size: 11px; color: #bbb; font-style: italic; }

@media (max-width: 800px) {
  .portal-browser { display: none; }
  .p-stat-row { grid-template-columns: repeat(2,1fr); }
}

/* ---- Results ---- */
.results-head {
  display: flex; justify-content: space-between; align-items: end;
  margin-bottom: 48px;
  gap: 40px; flex-wrap: wrap;
}
.results-scroll-wrap {
  position: relative;
}
.results-scroll-wrap::before,
.results-scroll-wrap::after {
  content: ""; position: absolute; top: 0; bottom: 16px; width: 60px;
  pointer-events: none; z-index: 2;
}
.results-scroll-wrap::before {
  left: 0;
  background: linear-gradient(90deg, var(--bg-2), transparent);
}
.results-scroll-wrap::after {
  right: 0;
  background: linear-gradient(-90deg, var(--bg-2), transparent);
}
.results-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.results-scroll::-webkit-scrollbar { display: none; }
.clip-card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  aspect-ratio: 9/16;
  position: relative;
  overflow: hidden;
  transition: transform 200ms ease, border-color 200ms ease;
  cursor: pointer;
  flex-shrink: 0;
  width: 175px;
  scroll-snap-align: start;
}
.clip-card:hover { transform: translateY(-3px); border-color: var(--line-2); }
.clip-thumb {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--c1, #1a1a24), var(--c2, #15151e));
  display: flex; align-items: center; justify-content: center;
}
.clip-thumb::before {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,0.02) 18px 19px),
    radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(212,255,58,0.18), transparent 55%);
}
.clip-play {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  transition: transform 200ms ease, background 200ms ease;
}
.clip-card:hover .clip-play {
  background: var(--accent); border-color: var(--accent); transform: scale(1.08);
  color: var(--accent-ink);
}
.clip-foot {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 12px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.75));
}
.clip-views {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 15px;
}
.clip-client {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--fg-2);
  letter-spacing: 0.08em;
  margin-top: 2px;
}
.clip-pill {
  position: absolute; top: 10px; left: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 3px 7px;
  border-radius: var(--radius-pill);
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  color: var(--fg-2);
  letter-spacing: 0.06em;
}
.clip-pill.featured { background: var(--accent); color: var(--accent-ink); }

/* ---- Video modal ---- */
.clip-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
}
.clip-modal {
  width: 340px; height: 610px;
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  background: #000;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
}
.clip-modal iframe { width: 100%; height: 100%; border: none; display: block; }
.clip-modal-close {
  position: absolute; top: -44px; right: 0;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; font-size: 20px; cursor: pointer; line-height: 1;
  font-family: inherit; border-radius: 50%;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  transition: background 150ms;
}
.clip-modal-close:hover { background: rgba(255,255,255,0.2); }
.clip-caption {
  font-size: 12px; font-weight: 500;
  line-height: 1.35;
  color: var(--fg-1);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ---- Testimonials ---- */
.reviews-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: 80px;
}
.review-card {
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 28px;
  display: flex; flex-direction: column; gap: 18px;
  transition: border-color 200ms ease;
}
.review-card:hover { border-color: var(--line-2); }
.review-stars {
  display: flex; gap: 3px;
  color: var(--accent);
}
.review-stars svg { width: 14px; height: 14px; }
.review-quote {
  font-size: 16px;
  color: var(--fg-2);
  line-height: 1.6;
  flex: 1;
  font-style: italic;
}
.review-quote::before { content: "\201C"; color: var(--accent); font-style: normal; margin-right: 2px; }
.review-quote::after { content: "\201D"; color: var(--accent); font-style: normal; margin-left: 2px; }
.review-metric {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  padding: 6px 12px;
  background: rgba(212,255,58,0.08);
  border: 1px solid rgba(212,255,58,0.18);
  border-radius: var(--radius-pill);
  display: inline-block;
  align-self: flex-start;
}
.review-author {
  display: flex; align-items: center; gap: 12px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.review-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 15px;
  color: var(--accent);
  flex-shrink: 0;
}
.review-name { font-weight: 600; font-size: 14px; }
.review-role { font-size: 12px; color: var(--fg-3); margin-top: 2px; }

@media (max-width: 900px) {
  .reviews-grid { grid-template-columns: 1fr; }
}

/* ---- Packages ---- */
.pkg-head {
  display: flex; justify-content: space-between; align-items: end;
  margin-bottom: 48px; gap: 40px; flex-wrap: wrap;
}
.pkg-toggle {
  display: inline-flex;
  background: var(--bg-2); border: 1px solid var(--line);
  padding: 4px; border-radius: var(--radius-pill);
}
.pkg-toggle button {
  padding: 10px 18px;
  border-radius: var(--radius-pill);
  font-size: 13px; font-weight: 500;
  color: var(--fg-2);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.04em;
  transition: background 200ms ease, color 200ms ease;
  position: relative;
}
.pkg-toggle button.active { background: var(--accent); color: var(--accent-ink); }
.pkg-save {
  font-size: 9.5px;
  background: rgba(255,255,255,0.1);
  color: var(--fg);
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
}
.pkg-toggle button.active .pkg-save { background: rgba(0,0,0,0.15); color: var(--accent-ink); }
.pkg-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
}
.pkg-card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  position: relative;
  display: flex; flex-direction: column;
  transition: transform 200ms ease, border-color 200ms ease, background 200ms ease;
  cursor: pointer;
}
.pkg-card:hover { border-color: var(--line-2); transform: translateY(-3px); }
.pkg-card.selected, .pkg-card.popular {
  background: var(--bg-3);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 30px 80px -40px var(--accent-glow);
}
.pkg-pop-tag {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px; letter-spacing: 0.1em;
  padding: 5px 12px; border-radius: var(--radius-pill);
}
.pkg-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-3);
  margin-bottom: 12px;
}
.pkg-card.popular .pkg-name { color: var(--accent); }
.pkg-title { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 6px; }
.pkg-desc { color: var(--fg-3); font-size: 14px; margin-bottom: 28px; min-height: 42px; }
.pkg-price {
  display: flex; align-items: baseline; gap: 6px;
  margin-bottom: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.pkg-price .currency { font-size: 22px; color: var(--fg-2); }
.pkg-price .amount { font-size: 52px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
.pkg-price .per { color: var(--fg-3); font-size: 13px; font-family: 'JetBrains Mono', monospace; }
.pkg-feats {
  list-style: none; padding: 0; margin: 0 0 32px 0;
  display: flex; flex-direction: column; gap: 14px;
  flex: 1;
}
.pkg-feats li {
  display: flex; gap: 12px; font-size: 14.5px; color: var(--fg-2);
  align-items: flex-start;
}
.pkg-feats .check {
  flex-shrink: 0; width: 18px; height: 18px;
  border-radius: 50%; background: rgba(212,255,58,0.12);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px;
}
.pkg-feats b { color: var(--fg); font-weight: 600; }
.pkg-card .btn {
  width: 100%; justify-content: center;
  background: var(--bg);
  border: 1px solid var(--line-2);
  color: var(--fg);
}
.pkg-card.popular .btn, .pkg-card.selected .btn {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}
.pkg-card .btn:hover { border-color: var(--fg-2); }
.pkg-card.popular .btn:hover, .pkg-card.selected .btn:hover { border-color: var(--accent); transform: translateY(-1px); }

@media (max-width: 900px) {
  .pkg-grid { grid-template-columns: 1fr; }
}

/* ---- FAQ ---- */
.faq-wrap { max-width: 880px; margin: 0 auto; }
.faq-item { border-bottom: 1px solid var(--line); }
.faq-q {
  width: 100%;
  display: flex; justify-content: space-between; align-items: center;
  padding: 26px 0;
  font-size: 19px; font-weight: 500;
  text-align: left;
  letter-spacing: -0.01em;
  transition: color 200ms ease;
}
.faq-q:hover { color: var(--accent); }
.faq-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-left: 24px;
  transition: background 200ms ease, transform 200ms ease;
  position: relative;
}
.faq-icon::before, .faq-icon::after {
  content: ""; position: absolute;
  background: var(--fg);
  transition: background 200ms ease, transform 200ms ease;
}
.faq-icon::before { width: 12px; height: 1.5px; }
.faq-icon::after { width: 1.5px; height: 12px; }
.faq-item.open .faq-icon { background: var(--accent); border-color: var(--accent); }
.faq-item.open .faq-icon::before, .faq-item.open .faq-icon::after { background: var(--accent-ink); }
.faq-item.open .faq-icon::after { transform: scaleY(0); }
.faq-a {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows 280ms ease;
}
.faq-item.open .faq-a { grid-template-rows: 1fr; }
.faq-a > div { overflow: hidden; }
.faq-a p {
  color: var(--fg-2);
  padding: 0 80px 28px 0;
  font-size: 16px;
  line-height: 1.6;
}
@media (max-width: 600px) {
  .faq-a p { padding: 0 0 24px 0; }
  .faq-q { font-size: 16px; padding: 20px 0; }
}

/* ---- Footer CTA ---- */
.foot-cta {
  border-top: 1px solid var(--line);
  position: relative;
  overflow: hidden;
}
.foot-cta-inner {
  padding: 140px 0;
  text-align: center;
  position: relative;
  z-index: 1;
}
.foot-cta-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 80% at 50% 50%, rgba(212,255,58,0.12), transparent 70%);
}
.foot-cta-bg::after {
  content: "";
  position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  background-position: center;
  mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, #000, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, #000, transparent 80%);
}
.foot-cta h2 {
  font-size: clamp(48px, 6vw, 92px);
  max-width: 14ch; margin: 0 auto 22px;
  letter-spacing: -0.045em;
}
.foot-cta p {
  color: var(--fg-2); font-size: 18px; margin-bottom: 38px;
  max-width: 46ch; margin-left: auto; margin-right: auto;
}
.foot-cta-meta {
  margin-top: 36px;
  display: flex; justify-content: center; gap: 28px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--fg-3); flex-wrap: wrap;
}

/* ---- Footer ---- */
.footer {
  border-top: 1px solid var(--line);
  background: var(--bg);
  padding: 60px 0 40px;
}
.footer-top {
  display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 40px; padding-bottom: 48px;
  border-bottom: 1px solid var(--line);
}
.footer-brand .logo { margin-bottom: 18px; }
.footer-brand p { color: var(--fg-3); font-size: 14px; max-width: 32ch; }
.footer-col h4 {

// ── Hero Background ───────────────────────────────────────────────────────────
function HeroBg({ mode = 'wave' }) {
  const ref = React.useRef(null);

  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf;
    let t = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      const r = canvas.getBoundingClientRect();
      canvas.width = r.width * dpr;
      canvas.height = r.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0006,
        vy: (Math.random() - 0.5) * 0.0006,
        r: Math.random() * 2.4 + 1.2,
        a: Math.random() * 0.6 + 0.3,
      });
    }

    function drawWave() {
      const w = canvas.width / dpr, h = canvas.height / dpr;
      ctx.clearRect(0, 0, w, h);
      const lines = 22;
      for (let i = 0; i < lines; i++) {
        const p = i / lines;
        const yBase = h * (0.15 + p * 0.7);
        const amp = 18 + p * 60;
        const freq = 0.004 + p * 0.002;
        const speed = 0.6 + p * 0.4;
        const phase = t * 0.0008 * speed;
        const grad = ctx.createLinearGradient(0, 0, w, 0);
        const alpha = 0.04 + (1 - Math.abs(p - 0.55)) * 0.22;
        grad.addColorStop(0, 'rgba(212,255,58,0)');
        grad.addColorStop(0.5, `rgba(212,255,58,${alpha})`);
        grad.addColorStop(1, 'rgba(212,255,58,0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 6) {
          const y = yBase + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.3 + phase * 1.4) * (amp * 0.35);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    function drawParticles() {
      const w = canvas.width / dpr, h = canvas.height / dpr;
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > 1) p.vx *= -1;
        if (p.y < 0 || p.y > 1) p.vy *= -1;
      }
      ctx.strokeStyle = 'rgba(212,255,58,0.08)';
      ctx.lineWidth = 0.7;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < 0.14) {
            ctx.globalAlpha = 1 - d / 0.14;
            ctx.beginPath();
            ctx.moveTo(a.x * w, a.y * h);
            ctx.lineTo(b.x * w, b.y * h);
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
      for (const p of particles) {
        const px = p.x * w, py = p.y * h;
        const grad = ctx.createRadialGradient(px, py, 0, px, py, p.r * 4);
        grad.addColorStop(0, `rgba(212,255,58,${p.a * 0.35})`);
        grad.addColorStop(1, 'rgba(212,255,58,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(px, py, p.r * 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `rgba(212,255,58,${p.a})`;
        ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI * 2); ctx.fill();
      }
    }

    function loop() {
      t += 16;
      if (mode === 'particles') drawParticles(); else drawWave();
      raf = requestAnimationFrame(loop);
    }
    loop();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [mode]);

  return <div className="hero-bg"><canvas ref={ref} /></div>;
}

  return (
    <section className="section-pad" id="faq" style={{ background: 'var(--bg-2)' }}>
      <div className="container">
        <div className="section-head" style={{ textAlign: 'center', margin: '0 auto 56px' }}>
          <div className="eyebrow" style={{ justifyContent: 'center' }}>Common questions</div>
          <h2 style={{ marginTop: 22 }}>Most-asked, answered.</h2>
        </div>
        <div className="faq-wrap">
          {faqs.map((f, i) => (
            <div key={i} className={`faq-item${open === i ? ' open' : ''}`}>
              <button className="faq-q" onClick={() => setOpen(open === i ? null : i)} aria-expanded={open === i}>
                <span>{f.q}</span>
                <span className="faq-icon" aria-hidden="true" />
              </button>
              <div className="faq-a"><div><p>{f.a}</p></div></div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}
